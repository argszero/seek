<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>seek</title>
  <desc>I Seek You — a speech bubble holding a pupil: it listens, and it looks.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5083fb"/>
      <stop offset="0.55" stop-color="#336df4"/>
      <stop offset="1" stop-color="#0442d2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#002f9e"/>
      <stop offset="1" stop-color="#0442d2"/>
    </linearGradient>
  </defs>

  <!-- squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>

  <!-- speech bubble: body -->
  <rect x="196" y="222" width="632" height="452" rx="150" fill="#ffffff"/>
  <!-- speech bubble: tail -->
  <path d="M300 580 L250 830 L470 610 Z" fill="#ffffff"/>

  <!-- the pupil -->
  <circle cx="512" cy="448" r="108" fill="url(#iris)"/>
  <!-- catchlight -->
  <circle cx="552" cy="406" r="33" fill="#ffffff" opacity="0.92"/>
</svg>
