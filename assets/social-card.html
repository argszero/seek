<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>seek — social preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(135deg, #5083fb 0%, #336df4 55%, #0442d2 100%);
        font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 0 96px;
        gap: 88px;
      }
      .mark {
        width: 320px;
        height: 320px;
        flex: 0 0 320px;
        border-radius: 72px;
        box-shadow: 0 24px 64px rgba(0, 20, 90, 0.35);
      }
      .text {
        flex: 1 1 auto;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 128px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -4px;
      }
      .tagline {
        margin: 22px 0 0;
        font-size: 34px;
        line-height: 1.25;
        font-weight: 500;
        opacity: 0.95;
      }
      .sub {
        margin: 30px 0 0;
        font-size: 25px;
        line-height: 1.45;
        opacity: 0.82;
        max-width: 620px;
      }
    </style>
  </head>
  <body>
    <img class="mark" src="icon.png" alt="" />
    <div class="text">
      <h1>seek</h1>
      <p class="tagline">I Seek You — the original spirit of IM.</p>
      <p class="sub">Typed like ICQ, shaped like the characters you know.</p>
    </div>
  </body>
</html>
