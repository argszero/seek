name: Release

# 打 tag (v*) 时自动构建各平台自包含安装包（TUI + GUI + WEBUI 全可用）并发布到 GitHub Release。
# 也支持手动触发 (workflow_dispatch) 用于预演。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS 安装包 (.pkg)：装到 ~/.seek/install，含 runtime + GUI app
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # macOS 安装包 (.pkg)：装到 ~/.seek/install，含 runtime + GUI app
  # ─────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    env:
      # secrets 不能在 if/step 中直接引用（GitHub Actions 硬限制）——先提升为 job 级 env。
      # 未配置时求值为空字符 → 各 step 用 'if: ... != ""' 守卫降级（本地/无证书不阻塞发布）。
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      # ── 导入签名证书（macOS only；Secret 未配则跳过降级）──
      # 单 p12 方案（经本地验证）：MACOS_SIGNING_P12_BASE64 用 signing-installer.p12——
      # 同一个 p12 同时含 Developer ID Application (AB9EDC) + Developer ID Installer (F2BE40BB)
      # 双身份，一次导入即可同时装备：electron-builder 用 CSC_KEYCHAIN 签 .app (Application)
      # 和 productsign 签 pkg (Installer)。
      # ⚠️ 不要拆成两个 p12 分别导入（signing3 + signing-installer 混在同一个 keychain）：
      # 本地复现确认会让 productsign 挂起（27min 无响应）。单 p12 一次导入则秒过。
      # ⚠️ 若换用 CSC_LINK（而非 CSC_KEYCHAIN），electron-builder 会 createKeychain 随机密码
      # 临时 keychain → set-key-partition-list 解锁报 "SecKeychainUnlock: passphrase is not
      # correct"（electron-builder 24.13.3 bug，EMRG 也踩过）。必须用 CSC_KEYCHAIN。
      # set-key-partition-list 用 -S apple-tool:,apple:（不可加 codesign: 分区，否则
      # SecItemCopyMatching item not found，EMRG v0.2.7 教训）。
      - name: Import signing certificate (macOS only)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12_BASE64 != ''
        shell: bash
        run: |
          security create-keychain -p 'ci-temp' /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security set-keychain-settings -lut 21600 /tmp/ci.keychain
          security unlock-keychain -p 'ci-temp' /tmp/ci.keychain

          # 单一 p12 → 同时含 Application + Installer 双身份（本地已验证，一次导入即够）
          echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
          IMPORT_OUTPUT="$(security import /tmp/signing.p12 -k /tmp/ci.keychain -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign 2>&1)"
          echo "$IMPORT_OUTPUT"
          if [[ ! "$IMPORT_OUTPUT" =~ identit(y|ies)\ imported ]]; then
            echo "::error::MACOS_SIGNING_P12_BASE64 未包含可签名私钥（security import 仅导入证书链）。请从 Keychain Access 导出含私钥的 p12（证书右键 → 导出 → 勾选\"包含私钥\"），重新 base64 后更新 GitHub Secret。import 输出：${IMPORT_OUTPUT}"
            exit 1
          fi

          # 双证书存在性校验（Application 签 .app，Installer 签 pkg，缺一不可）。
          # 必须用输出判空而非退出码：find-certificate 无匹配证书时也返回 exit 0。
          for CERT_NAME in "Developer ID Application" "Developer ID Installer"; do
            if [ -z "$(security find-certificate -c "$CERT_NAME" -a /tmp/ci.keychain 2>/dev/null)" ]; then
              echo "::error::keychain 缺少 $CERT_NAME 证书（签名必需）。请导出含 Application + Installer 两证书+私钥的 p12 到 MACOS_SIGNING_P12_BASE64。"
              exit 1
            fi
          done

          security set-key-partition-list -S apple-tool:,apple: -s -k 'ci-temp' /tmp/ci.keychain
          security list-keychains -d user -s /tmp/ci.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning /tmp/ci.keychain

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Backend venv
        working-directory: backend
        shell: bash   # 统一用 bash：unset / uv / 多行脚本在 mac+win 都一致
        env:
          UV_PYTHON_PREFERENCE: "only-managed"   # 用 uv 管理的 standalone CPython，避免系统 framework 的断链
        run: |
          unset VIRTUAL_ENV   # CI 预置的 VIRTUAL_ENV 会把 venv 重定向到 repo 根
          uv python install 3.13
          uv sync --project .

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Build GUI app (electron-builder)
        working-directory: gui
        shell: bash
        run: |
          # macOS 签名：用 CSC_KEYCHAIN 指向已授权 keychain（/tmp/ci.keychain，Import step
          # 已导入 Application p12 + set-key-partition-list 授权），绕过 electron-builder
          # 自己创建的临时 keychain。
          # ⚠️ 不可用 CSC_LINK：electron-builder 收到 CSC_LINK 会 createKeychain 一个
          # 随机密码临时 keychain，然后 importCerts 用 CSC_KEY_PASSWORD 去 set-key-partition-list
          # 解锁它 → "SecKeychainUnlock: passphrase is not correct"（electron-builder 24.13.3 bug，
          # 本地复现确认、EMRG 也踩过）。用 CSC_KEYCHAIN 则不创建临时 keychain，直接用已授权 keychain。
          # ⚠️ 不可设 CSC_IDENTITY_AUTO_DISCOVERY=false（会禁用签 .app，公证必然失败）。
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${MACOS_SIGNING_P12_BASE64:-}" ]; then
            export CSC_KEYCHAIN="/tmp/ci.keychain"
            export CSC_IDENTITY_AUTO_DISCOVERY="true"
          fi
          npm install        # package.json 有 electron-builder，用 install 让 lockfile 同步
          npx electron-builder --dir   # → gui/dist/mac-arm64/seek.app

      - name: Assemble runtime
        run: bash packaging/build-runtime.sh
      - name: Build installer (.pkg)
        run: bash packaging/make-installer.sh darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-macos
          path: dist/artifacts/*.pkg

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/artifacts/*
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────────
  # Windows 安装包 (.exe)：Inno Setup，含 runtime + GUI exe
  # ─────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Backend venv
        working-directory: backend
        shell: bash   # 统一用 bash：unset / uv / 多行脚本在 mac+win 都一致
        env:
          UV_PYTHON_PREFERENCE: "only-managed"   # 用 uv 管理的 standalone CPython，避免系统 framework 的断链
        run: |
          unset VIRTUAL_ENV   # CI 预置的 VIRTUAL_ENV 会把 venv 重定向到 repo 根
          uv python install 3.13
          uv sync --project .

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Build GUI app (electron-builder)
        working-directory: gui
        run: |
          npm install
          npx electron-builder --dir   # → gui/dist/win-unpacked/seek.exe

      - name: Assemble runtime
        run: bash packaging/build-runtime.sh
      - name: Install Inno Setup (iscc)
        shell: pwsh
        run: |
          # Inno Setup 6 via choco so ISCC.exe is on PATH for the installer build.
          choco install innosetup -y --no-progress
      - name: Build installer (.exe)
        shell: pwsh
        run: |
          Get-Command iscc -ErrorAction SilentlyContinue | Out-Null
          bash packaging/make-installer.sh windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-windows
          path: dist/artifacts/*.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/artifacts/*
          generate_release_notes: true
