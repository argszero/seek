name: Release

# A download is built on a runner, not on one person's machine.
#
# Why this file exists: the installer step is `pkgbuild`, which the environment this
# repository is developed in permits, but electron-builder's `dmg` target is not — it ends in
# `hdiutil create`, which that environment refuses. A release only one machine can build is a
# release that stops when that machine does, so a `v*` tag runs the same `npm run dist:pkg` a
# person runs, on a macOS runner, and attaches what it produced to the release.
#
# The recipe is the `ui/package.json` script and never a second copy written here: this file
# says where and when, and `packaging/make-pkg.mjs` says what. The packaging test pins that
# this file names that script rather than reimplementing it.
#
# **This repository has no pull-request workflow yet**, so nothing here runs on a pull
# request: a green run of this file is only ever seen from a tag, which is why a `v*` push is
# the first moment any of it is executed at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos-arm64:
    # Apple silicon only: it is the one architecture the app declares (`ui/package.json`'s
    # mac target) and the one the README's download names. A second architecture is a second
    # decision about what this project ships, not a matrix row to be guessed here.
    runs-on: macos-15
    permissions:
      contents: write # creating the release; every step before it only reads
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `engines` says ">=22.18", which is where Node strips TypeScript by itself — the
          # fact that lets `npm test` run the kernel with no build step and no bundler.
          node-version: "22.18"

      # The kernel's suite is the regression gate: a release is cut from a green tree, and a
      # red one stops here rather than publishing an app nobody tested.
      - name: Kernel tests
        run: npm test

      - name: Interface tests
        working-directory: ui
        run: |
          npm ci
          npm test

      # Signing has to happen on the machine that builds, because what it does is embed a
      # signature in the bytes being built — there is no way to sign a file you did not make.
      # Two certificates arrive from repository secrets and they are **not interchangeable**:
      # `Developer ID Application` signs the app (electron-builder does that during the build,
      # reading `CSC_LINK` below) and `Developer ID Installer` signs the package
      # (`packaging/make-pkg.mjs`). An installer and a bundle are judged by two different parts
      # of the system, and `productsign` refuses an Application certificate outright.
      #
      # A keychain per run, created with a password generated in the same step: nothing about
      # the identity survives the runner, and nothing is written to the repository.
      - name: Import the signing certificates
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/seek-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$MACOS_SIGNING_P12_BASE64"   | openssl base64 -d -A -out "$RUNNER_TEMP/application.p12"
          printf '%s' "$MACOS_INSTALLER_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/installer.p12"
          for NAME in application installer; do
            security import "$RUNNER_TEMP/$NAME.p12" -k "$KEYCHAIN" \
              -P "$MACOS_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Read the identities back rather than trusting the import's own wording. A p12 that
          # carries a certificate chain with no private key imports without an error on some
          # versions and then signs nothing — that failure is the neighbouring EMRG project's,
          # where four release runs died on it before the check was written down.
          security find-identity -v "$KEYCHAIN"
          for NAME in "Developer ID Application" "Developer ID Installer"; do
            if ! security find-identity -v "$KEYCHAIN" | grep -q "$NAME"; then
              echo "::error::no $NAME identity in the imported keychain — check MACOS_SIGNING_P12_BASE64 / MACOS_INSTALLER_P12_BASE64"
              exit 1
            fi
          done

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CSC_LINK=$RUNNER_TEMP/application.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_P12_PASSWORD" >> "$GITHUB_ENV"

      # The notary key is a third credential again — an App Store Connect API key, not a
      # certificate. It is written out here rather than kept anywhere, and `packaging/notarize.mjs`
      # reads it by path.
      - name: Write the notary key
        env:
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The one command that makes both artifacts: `vite build`, electron-builder's `--dir`
      # output (the `.app`, and deliberately not the `dmg` target) and
      # `packaging/make-pkg.mjs` over that bundle.
      - name: Build the app and its installer
        working-directory: ui
        env:
          # Read by `packaging/make-pkg.mjs`, which signs the package it just cut. Unset on a
          # development machine, where the same command still has to produce a buildable file.
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: npm run dist:pkg

      # A tag and the app it releases have to name one version. `v0.2.0` over a tree whose
      # `ui/package.json` still says 0.1.0 would publish an installer claiming the older
      # version, and the release page would be the only place the two disagreed.
      - name: The tag names the version the app carries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./ui/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v${APP_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the app's version v${APP_VERSION}"
            exit 1
          fi

      # The zip beside the pkg: it is the file v0.1.0 published, its instructions are a drag,
      # and the bytes in it are the same bundle. Kept so a release does not silently stop
      # offering the shape people already downloaded.
      - name: Zip the bundle
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./ui/package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent \
            ui/release/mac-arm64/Seek.app \
            "ui/release/Seek-${VERSION}-arm64-mac.zip"
          ls -la ui/release/*.pkg ui/release/*.zip

      # Signing answers one refusal and notarization answers the other. A signed package is one
      # macOS installs; an app whose code Apple has looked at is one that launches on a machine
      # that has never seen the developer. Both are needed before a download stops arguing with
      # the person who downloaded it.
      #
      # `--wait` rather than submit-and-poll, because this step's result is the release's
      # result. The verdict is read out of notarytool's JSON, never its exit code: on the
      # neighbouring EMRG project a submission that came back `Invalid` still exited 0.
      - name: Notarize the installer
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: node packaging/notarize.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: seek-macos-arm64
          path: |
            ui/release/*.pkg
            ui/release/*.zip
          if-no-files-found: error

      # A pre-release, and deliberately so. One of the two reasons it was published that way no
      # longer holds — the download is signed and notarized from this tag on, so macOS stops
      # objecting — and the other one still does: the package carries no model, so the bot
      # answers in the kernel's placeholder until the reader starts a `llama-server` of their
      # own and names it (defaults 20 and 27). `Latest` claims a program that does the thing
      # the product is about when it opens, and this one needs a server named first. Recorded
      # as default 29 in `docs/decisions.md`, which is where the word that changes it is
      # written down.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            ui/release/*.pkg
            ui/release/*.zip
          generate_release_notes: true
