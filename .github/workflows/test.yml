name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Actionlint (workflow lint)
        uses: rhysd/actionlint@v1.7.12
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync
          uv run pytest tests/ -v

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: TUI tests
        working-directory: tui
        run: |
          uv sync
          uv run pytest tests/ -v

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: WebUI build + typecheck
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: WebUI unit tests
        working-directory: webui
        run: npm test
      - name: WebUI lint
        working-directory: webui
        run: npm run lint || true

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: GUI syntax check + unit tests
        working-directory: gui
        run: |
          npm ci
          node --check main.js && node --check preload.js && node --check daemon_client.js
          npm test
