[project]
name = "seekd"
version = "0.1.5"
description = "seek daemon — the AI-native IM backend (webSocket IPC, group-chat orchestration, agents)"
license = { file = "../LICENSE" }
authors = [{ name = "argszero" }]
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "websockets>=17.0.1",
]

[project.scripts]
seek = "seekd.launcher:main"
seekd = "seekd.__main__:main_daemon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["seekd/**/*.py", "seekd/**/*.j2", "LICENSE", "README.md", "README.cn.md"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
