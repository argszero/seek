# agents.yml — the roster of agents (`host-rulings.md`, "Bot and agent as two objects").
#
# What is registered here is agents, not bots. Each bot is the grouping, its rows
# are its workers, and nothing caps a bot at two: a bot that later needs a third
# role gets a third row and the two that were there first need no migration.
#
# This file is the roster, and the store's agents are rebuilt from it every time
# the kernel opens the store beside it.
# A row's id is derived from its bot and its role, so a row keeps the sessions
# and memories it had before the rebuild.
#
# Editing it is how a bot is given a different set of workers; deleting it is not,
# because a store with no roster file beside it keeps the agents it already has —
# a missing file says nothing about the store, while a file that is there and
# holds no rows says the bot has no agents.
#
# Two spaces for `- `, four for a field, whole-line comments only, lists in one
# line. Anything outside that subset is an error naming the line: this parser
# would rather stop than quietly drop a field it did not understand.
#
# `model` and `prompt` are absent below, which means `unset` — choosing a model
# is a measurement (`src/README.md` line 26), and this file has no standing to
# pick one.
agents:
  - bot: Echo
    role: watch
    # The half that cannot write: a decision model produces no text and calls no
    # tool. `[]` is a real answer here, not a placeholder.
    tools: []
  - bot: Echo
    role: work
    # This is the permission ceiling, and it names the whole registry
    # (`docs/host-rulings.md`, "The tools") rather than the tools today's artifact
    # happens to offer. The two are different questions, and reading them as one is what
    # muted every bot on a real install: a row written by an older first run named two
    # tools, the artifact grew to six, and the bind refused — the person's file and the
    # shipped prompt drifting apart, reported as a model that was not ready.
    #
    # So the row says everything this agent may ever call, and each turn is offered the
    # intersection of that ceiling with the artifact. A tool here that no artifact offers
    # yet costs nothing (it is never declared to a model) and is what makes a capability
    # arrive without the file having to be edited again. `say` is the one entry the row
    # cannot do without — it is the only way into a room — and a row that lost it is
    # refused at bind.
    tools: [say, schedule, bash, read, write, edit, glob, grep, subagent, submit_rant, boss]
